# Fact bank, extracted from voice_skills.txt §14.
# status: canonical  -> drafts may use it
#         conflict   -> drafts must NOT use it; Meera resolves it via /facts
# Only the bot's /facts command should change statuses (it writes a timestamp).

facts:
  - key: meera_founder
    status: canonical
    text: Meera Pillai is the founder of Skinstinct.
  - key: meera_background
    status: canonical
    text: Meera spent two years working in pharmaceutical formulation before Skinstinct.
  - key: meera_not_derm
    status: canonical
    text: Meera is not a dermatologist and has no medical degree. She can read a CoA and understands stability documentation and formulation chemistry.
  - key: stability_review_2021
    status: canonical
    text: In 2021 Meera sat in a stability review at the pharma company where a cosmeceutical had an 8% active, a 24-month stability claim, and a finished pH of 3.2 against known degradation below pH 3.8. The testing protocol had been inherited from another product. It passed review. She left 7 months later.
  - key: cm_brief
    status: canonical
    text: Skinstinct's contract manufacturer brief requires pH documentation, stability testing at three-month intervals for the first year, and mid-batch CoA sampling.
  - key: serum_ph
    status: canonical
    text: Skinstinct serum pH is 5.5-5.8, documented on every batch.
  - key: fragrance_free
    status: canonical
    text: Everything Skinstinct makes is fragrance-free, including the preservative system, emollients and carrier ingredients.
  - key: no_parabens
    status: canonical
    text: Skinstinct uses no parabens, for pragmatic and customer-trust reasons, not because Meera believes they are dangerous at cosmetic concentrations.
  - key: ceramides
    status: canonical
    text: Skinstinct's ceramide approach uses ceramide NP and AP, paired with cholesterol and fatty acids to approximate the physiological ratio. No product is marketed primarily on barrier repair.
  - key: testing_published
    status: canonical
    text: Testing details (sample size, study type, who ran it) are published on the Skinstinct website; some testing is early stage.
  - key: does_not_sell
    status: canonical
    text: Skinstinct does not sell a Vitamin C product, a peptide product, or a sunscreen.
  - key: products_in_formulation
    status: canonical
    text: Skinstinct has two products in formulation, not yet discussed in detail; one has been in development for over a year.
  - key: vitamin_c_attempt
    status: canonical
    text: Meera has been trying to formulate a Vitamin C product for about 14 months (as of newsletter_004). Internal testing found L-ascorbic acid above 10% needed airless pump packaging, pH below 3.5, and an antioxidant support system for 12-month stability; without all three, concentration dropped measurably within 4-6 months.
  - key: returns_texture
    status: canonical
    text: In the 12 months to June 2025, 23% of Skinstinct returns cited texture or feel; 71% of those were from cities with average annual humidity above 70% (Mumbai, Chennai, Kochi, Kolkata).
  - key: serum_reformulation
    status: canonical
    text: The original serum base was too film-forming for high humidity. It was reformulated to a lighter base with an adjusted humectant-to-occlusive balance. Active concentrations were unchanged.
  - key: repeat_rate
    status: canonical
    text: Skinstinct's 12-month repeat purchase rate is 67%. Meera cites 20-40% as the typical DTC range and does not claim to know how much is formulation versus trust.
  - key: fragrance_conversation
    status: canonical
    text: Meera has had the fragrance-free explanation conversation "a few hundred times."

conflicts:
