    text: linkedin_post_002 says "Three years later" (from the 2021 meeting). newsletter_011 is titled "18 months of Skinstinct" but refers to "this year" and "the first year". newsletter_008 references "the last two years" with the contract manufacturer. Needs one canonical launch date.
    resolution: null
    resolved_at: null
  - key: C2
    status: conflict
    title: Return metrics
    text: linkedin_post_003 reports shares of returns (23% texture, 71% humid-city, then "dropped to 8%"). newsletter_011 reports a return RATE in humid cities "almost three times" elsewhere. These are different measures and must never be combined. What does "dropped to 8%" measure?
    resolution: null
    resolved_at: null
  - key: C3
    status: conflict
    title: Niacinamide concentration
    text: newsletter_002 uses "niacinamide at 4%, pH 5.5-6.0, documented six-month stability" as an illustrative example, not Skinstinct's spec. Skinstinct's actual niacinamide concentration has not been supplied.
    resolution: null
    resolved_at: null
  - key: C4
    status: conflict
    title: Product in development
    text: Is the product "in development for over a year" (newsletter_011) the Vitamin C product from newsletter_004? Do not assume they are the same.
    resolution: null
    resolved_at: null

