# Which Google News publishers a draft may cite. Matched on the publisher's domain (Google News gives it for every
# item), including subdomains: "indiatimes.com" would match economictimes.indiatimes.com.
#
# NEWS_TRUSTED_ONLY=true (default): only `trusted` publishers are offered to the model as a news hook.
# NEWS_TRUSTED_ONLY=false: unknown publishers are allowed too, but flagged on the review card.
# `blocked` publishers are never used, in either mode.

trusted:
